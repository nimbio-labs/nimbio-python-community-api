; Run `tox` to test against every Python below that is installed locally
; (e.g. via pyenv/uv). Each env builds the package in isolation and runs pytest.
; `tox -e lint` / `tox -e type` run ruff / mypy once on the current interpreter.

[tox]
envlist = py39, py310, py311, py312, py313, lint, type
skip_missing_interpreters = true

[testenv]
extras = test
commands = pytest -q {posargs}

[testenv:lint]
extras = dev
commands = ruff check .

[testenv:type]
extras = dev
commands = mypy
